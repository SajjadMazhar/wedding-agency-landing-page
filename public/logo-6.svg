<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B872"/>
      <stop offset="50%" stop-color="#CFAF6F"/>
      <stop offset="100%" stop-color="#B8954A"/>
    </linearGradient>
    <linearGradient id="gold6v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B872"/>
      <stop offset="100%" stop-color="#B8954A"/>
    </linearGradient>
  </defs>

  <!-- Shield/crest shape -->
  <path d="M200 40 L320 80 L320 220 C320 290, 265 340, 200 365 C135 340, 80 290, 80 220 L80 80 Z" fill="none" stroke="url(#gold6)" stroke-width="1.8"/>
  <path d="M200 52 L310 88 L310 218 C310 282, 258 328, 200 352 C142 328, 90 282, 90 218 L90 88 Z" fill="none" stroke="url(#gold6)" stroke-width="0.5" opacity="0.4"/>

  <!-- Crown element at top -->
  <g fill="url(#gold6)" stroke="url(#gold6)" stroke-width="0.5" opacity="0.6">
    <path d="M175 75 L180 65 L185 72 L190 60 L195 72 L200 55 L205 72 L210 60 L215 72 L220 65 L225 75 Z"/>
    <circle cx="200" cy="52" r="2"/>
  </g>

  <!-- Crossed camera and film reel (coat of arms style) -->
  <g stroke="#4A403A" stroke-width="0.8" fill="none" opacity="0.2">
    <!-- Left: camera -->
    <rect x="145" y="130" width="35" height="25" rx="3" transform="rotate(-15 162 142)"/>
    <circle cx="162" cy="142" r="8" transform="rotate(-15 162 142)"/>
    <!-- Right: film reel -->
    <circle cx="238" cy="140" r="15" transform="rotate(15 238 140)"/>
    <circle cx="238" cy="140" r="5" transform="rotate(15 238 140)"/>
    <circle cx="238" cy="128" r="2" transform="rotate(15 238 140)"/>
    <circle cx="248" cy="136" r="2" transform="rotate(15 238 140)"/>
    <circle cx="248" cy="148" r="2" transform="rotate(15 238 140)"/>
    <circle cx="238" cy="152" r="2" transform="rotate(15 238 140)"/>
    <circle cx="228" cy="148" r="2" transform="rotate(15 238 140)"/>
    <circle cx="228" cy="136" r="2" transform="rotate(15 238 140)"/>
  </g>

  <!-- Central monogram in ornate circle -->
  <circle cx="200" cy="195" r="52" fill="none" stroke="url(#gold6)" stroke-width="1"/>
  <circle cx="200" cy="195" r="46" fill="none" stroke="url(#gold6)" stroke-width="0.4" stroke-dasharray="2 2"/>

  <!-- "ADS" intertwined monogram -->
  <g fill="#4A403A">
    <!-- A large -->
    <path d="M180 225 L195 165 C196 161, 198 159, 200 159 C202 159, 204 161, 205 165 L220 225 L214 225 L209 208 L191 208 L186 225 Z M193 202 L207 202 L200 175 Z"/>
  </g>

  <!-- Flourish around monogram -->
  <g stroke="url(#gold6)" stroke-width="0.7" fill="none" opacity="0.5">
    <path d="M148 195 C148 185, 155 175, 165 170"/>
    <path d="M252 195 C252 185, 245 175, 235 170"/>
    <path d="M148 195 C148 205, 155 215, 165 220"/>
    <path d="M252 195 C252 205, 245 215, 235 220"/>
  </g>

  <!-- Banner ribbon -->
  <g fill="none" stroke="url(#gold6)" stroke-width="1">
    <path d="M120 270 L145 260 L255 260 L280 270 L255 280 L145 280 Z" fill="url(#gold6)" fill-opacity="0.08"/>
    <path d="M120 270 L145 260 L255 260 L280 270 L255 280 L145 280 Z"/>
    <!-- Ribbon tails -->
    <path d="M120 270 L108 265 L115 270 L108 275 Z" fill="url(#gold6)" fill-opacity="0.15"/>
    <path d="M280 270 L292 265 L285 270 L292 275 Z" fill="url(#gold6)" fill-opacity="0.15"/>
  </g>

  <!-- Text on banner -->
  <text x="200" y="274" text-anchor="middle" font-family="serif" font-size="11" letter-spacing="4" fill="#4A403A">DIGITAL STUDIO</text>

  <!-- Below banner -->
  <text x="200" y="305" text-anchor="middle" font-family="serif" font-size="8" letter-spacing="3" fill="#8A7B6D">PHOTOGRAPHY &amp; VIDEOGRAPHY</text>

  <!-- Bottom stars/dots -->
  <circle cx="175" cy="320" r="1.5" fill="url(#gold6)"/>
  <circle cx="200" cy="325" r="2" fill="url(#gold6)"/>
  <circle cx="225" cy="320" r="1.5" fill="url(#gold6)"/>
</svg>
