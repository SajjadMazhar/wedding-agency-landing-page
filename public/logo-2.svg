<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B872"/>
      <stop offset="50%" stop-color="#CFAF6F"/>
      <stop offset="100%" stop-color="#B8954A"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal frame - thicker -->
  <polygon points="200,30 350,100 350,300 200,370 50,300 50,100" fill="none" stroke="url(#gold2)" stroke-width="3"/>
  <polygon points="200,50 335,113 335,287 200,350 65,287 65,113" fill="none" stroke="url(#gold2)" stroke-width="1.2" opacity="0.6"/>

  <!-- Camera shutter iris - bolder -->
  <g fill="none" stroke="url(#gold2)" stroke-width="2" opacity="0.25">
    <path d="M200 115 L235 155 L215 162 Z"/>
    <path d="M255 140 L262 185 L242 176 Z"/>
    <path d="M270 195 L240 230 L234 212 Z"/>
    <path d="M248 255 L208 260 L214 242 Z"/>
    <path d="M200 280 L165 245 L185 240 Z"/>
    <path d="M145 258 L140 215 L160 222 Z"/>
    <path d="M130 200 L162 170 L166 188 Z"/>
    <path d="M152 145 L192 140 L186 158 Z"/>
  </g>

  <!-- Central lens circles - thicker -->
  <circle cx="200" cy="195" r="60" fill="none" stroke="url(#gold2)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="195" r="38" fill="none" stroke="url(#gold2)" stroke-width="1.2" opacity="0.4"/>

  <!-- Stylized "A" - much bolder -->
  <g fill="#3A302A">
    <path d="M168 248 L192 170 C195 161, 198 156, 200 156 C202 156, 205 161, 208 170 L232 248 L220 248 L212 222 L188 222 L180 248 Z M192 210 L208 210 L200 180 Z"/>
  </g>

  <!-- Decorative "D" and "S" flanking - larger and bolder -->
  <text x="148" y="205" text-anchor="middle" font-family="serif" font-size="28" fill="#3A302A" opacity="0.7" font-style="italic">D</text>
  <text x="252" y="205" text-anchor="middle" font-family="serif" font-size="28" fill="#3A302A" opacity="0.7" font-style="italic">S</text>

  <!-- Top ornament - bolder -->
  <g stroke="url(#gold2)" stroke-width="1.5" fill="none">
    <path d="M178 82 C190 74, 195 65, 200 56 C205 65, 210 74, 222 82"/>
    <path d="M186 86 C194 79, 197 72, 200 64 C203 72, 206 79, 214 86"/>
    <circle cx="200" cy="53" r="3" fill="url(#gold2)" stroke="none"/>
  </g>

  <!-- Bottom ornament - bolder -->
  <g stroke="url(#gold2)" stroke-width="1.5" fill="none">
    <path d="M178 312 C190 320, 195 329, 200 338 C205 329, 210 320, 222 312"/>
    <circle cx="200" cy="340" r="3" fill="url(#gold2)" stroke="none"/>
  </g>

  <!-- Text - larger and bolder -->
  <text x="200" y="282" text-anchor="middle" font-family="serif" font-size="16" letter-spacing="7" fill="#3A302A" font-weight="500">ASLAM</text>
  <text x="200" y="304" text-anchor="middle" font-family="serif" font-size="11" letter-spacing="5" fill="#5A4F48" font-weight="400">DIGITAL STUDIO</text>

  <!-- Dot accents - larger -->
  <circle cx="155" cy="277" r="2.5" fill="url(#gold2)"/>
  <circle cx="245" cy="277" r="2.5" fill="url(#gold2)"/>
  <circle cx="155" cy="299" r="2" fill="url(#gold2)" opacity="0.7"/>
  <circle cx="245" cy="299" r="2" fill="url(#gold2)" opacity="0.7"/>
</svg>
