<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B872"/>
      <stop offset="50%" stop-color="#CFAF6F"/>
      <stop offset="100%" stop-color="#B8954A"/>
    </linearGradient>
    <linearGradient id="dark3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A403A"/>
      <stop offset="100%" stop-color="#3A302A"/>
    </linearGradient>
  </defs>

  <!-- Square frame with ornate corners -->
  <rect x="50" y="50" width="300" height="300" fill="none" stroke="url(#gold3)" stroke-width="1.2" rx="3"/>
  <rect x="60" y="60" width="280" height="280" fill="none" stroke="url(#gold3)" stroke-width="0.5" rx="2" opacity="0.4"/>

  <!-- Corner flourishes -->
  <g stroke="url(#gold3)" stroke-width="0.8" fill="none">
    <!-- Top-left -->
    <path d="M70 70 C85 70, 85 70, 85 85"/>
    <path d="M70 70 C70 85, 70 85, 85 85"/>
    <path d="M72 72 C82 72, 82 72, 82 82"/>
    <!-- Top-right -->
    <path d="M330 70 C315 70, 315 70, 315 85"/>
    <path d="M330 70 C330 85, 330 85, 315 85"/>
    <path d="M328 72 C318 72, 318 72, 318 82"/>
    <!-- Bottom-left -->
    <path d="M70 330 C85 330, 85 330, 85 315"/>
    <path d="M70 330 C70 315, 70 315, 85 315"/>
    <path d="M72 328 C82 328, 82 328, 82 318"/>
    <!-- Bottom-right -->
    <path d="M330 330 C315 330, 315 330, 315 315"/>
    <path d="M330 330 C330 315, 330 315, 315 315"/>
    <path d="M328 328 C318 328, 318 328, 318 318"/>
  </g>

  <!-- Camera body silhouette (minimal/geometric) -->
  <g fill="none" stroke="url(#gold3)" stroke-width="1" opacity="0.25">
    <rect x="155" y="145" width="90" height="65" rx="5"/>
    <circle cx="200" cy="177" r="22"/>
    <circle cx="200" cy="177" r="14"/>
    <rect x="170" y="140" width="25" height="8" rx="2"/>
    <circle cx="230" cy="152" r="3"/>
  </g>

  <!-- Main text: "Aslam" in script -->
  <text x="200" y="215" text-anchor="middle" font-family="cursive, serif" font-size="48" fill="url(#dark3)" font-style="italic">Aslam</text>

  <!-- Divider line -->
  <line x1="140" y1="230" x2="260" y2="230" stroke="url(#gold3)" stroke-width="0.8"/>
  <circle cx="140" cy="230" r="2" fill="url(#gold3)"/>
  <circle cx="200" cy="230" r="2" fill="url(#gold3)"/>
  <circle cx="260" cy="230" r="2" fill="url(#gold3)"/>

  <!-- Subtitle -->
  <text x="200" y="255" text-anchor="middle" font-family="serif" font-size="12" letter-spacing="5" fill="#4A403A">DIGITAL STUDIO</text>
  <text x="200" y="278" text-anchor="middle" font-family="serif" font-size="8" letter-spacing="3" fill="#8A7B6D">PHOTOGRAPHY &amp; VIDEOGRAPHY</text>

  <!-- Top center ornament -->
  <g stroke="url(#gold3)" stroke-width="0.7" fill="none" opacity="0.6">
    <path d="M185 95 C192 88, 196 80, 200 72 C204 80, 208 88, 215 95"/>
    <path d="M190 98 C195 92, 198 85, 200 78 C202 85, 205 92, 210 98"/>
    <line x1="200" y1="70" x2="200" y2="62"/>
    <circle cx="200" cy="60" r="1.5" fill="url(#gold3)" stroke="none"/>
  </g>

  <!-- Bottom center ornament -->
  <g stroke="url(#gold3)" stroke-width="0.7" fill="none" opacity="0.6">
    <path d="M185 305 C192 312, 196 320, 200 328 C204 320, 208 312, 215 305"/>
    <circle cx="200" cy="330" r="1.5" fill="url(#gold3)" stroke="none"/>
  </g>

  <!-- Side leaf accents -->
  <g stroke="url(#gold3)" stroke-width="0.6" fill="none" opacity="0.4">
    <path d="M85 180 C95 175, 100 185, 95 195 C90 185, 85 190, 80 185"/>
    <path d="M315 180 C305 175, 300 185, 305 195 C310 185, 315 190, 320 185"/>
  </g>
</svg>
